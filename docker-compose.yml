version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arcana-postgres
    environment:
      POSTGRES_USER: arcana
      POSTGRES_PASSWORD: arcana_password
      POSTGRES_DB: arcana_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arcana-net

  redis:
    image: redis:7-alpine
    container_name: arcana-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arcana-net

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: arcana-qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - arcana-net

  embeddings-svc:
    build:
      context: ./scripts/embeddings
      dockerfile: Dockerfile
    container_name: arcana-embeddings
    ports:
      - "18000:8000"
    environment:
      - FALLBACK_AITUNNEL_API_KEY=${AITUNNEL_API_KEY}
      - FALLBACK_AITUNNEL_BASE_URL=${AITUNNEL_BASE_URL}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - arcana-net

  ingest:
    build:
      context: ./scripts/ingest
      dockerfile: Dockerfile.ingest
    container_name: arcana-ingest
    environment:
      - EMBEDDINGS_URL=http://embeddings-svc:8000/embed
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
      - embeddings-svc
    networks:
      - arcana-net
    # Сервис завершает работу после выполнения скрипта

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arcana-backend
    ports:
      - "18080:8080"
    environment:
      - GIN_MODE=debug
      - AITUNNEL_API_KEY=${AITUNNEL_API_KEY}
      - AITUNNEL_BASE_URL=${AITUNNEL_BASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - MODERATION_SALT=${MODERATION_SALT}
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgres://arcana:arcana_password@postgres:5432/arcana_db?sslmode=disable
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDINGS_SVC_URL=http://embeddings-svc:8000
    depends_on:
      - postgres
      - redis
      - qdrant
      - embeddings-svc
      - ingest
    networks:
      - arcana-net
      
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: arcana-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_URL=http://127.0.0.1:18080
    depends_on:
      - backend
    network_mode: "host"
    restart: unless-stopped
    
  maxbot:
    build:
      context: .
      dockerfile: Dockerfile.maxbot
    container_name: arcana-maxbot
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - MAX_API_BASE_URL=${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      # ВАЖНО: При использовании host сети мы обращаемся к бэкенду через localhost и проброшенный порт
      - BACKEND_URL=http://127.0.0.1:18080
    depends_on:
      - backend
    network_mode: "host"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: arcana-frontend
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:18080
    depends_on:
      - backend
    networks:
      - arcana-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  hf_cache:

networks:
  arcana-net:
    driver: bridge
